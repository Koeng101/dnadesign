name: golangci-lint

on:
  push:
    tags:
      - v*
    branches:
      - main
  pull_request:
jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # golangci-lint type-checks against the Go it finds. With no setup-go it
      # used the runner's preinstalled Go, which has moved to 1.26, while the
      # action's "latest" resolves to golangci-lint 1.64.8 built with go1.24 --
      # hence "file requires newer Go version go1.26 (application built with
      # go1.24)". Pin both so they cannot drift apart again.
      - uses: actions/setup-go@v5
        with:
          go-version: 1.24.x
          cache-dependency-path: lib/go.sum
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          working-directory: lib
